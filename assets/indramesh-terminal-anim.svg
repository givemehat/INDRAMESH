<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Card & Glow Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="50%" stop-color="#070f22"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>

    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b162c"/>
      <stop offset="50%" stop-color="#0e1d3a"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="progressBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="termGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f5d4" stroke-opacity="0.03" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    /* Keyframe Animations for Micro-Animations */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes progressSweep {
      0% { width: 0%; }
      75% { width: 96%; }
      85% { width: 100%; }
      100% { width: 100%; }
    }
    @keyframes msgReveal1 {
      0%, 3% { opacity: 0; }
      5%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes msgReveal2 {
      0%, 14% { opacity: 0; }
      17%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes msgReveal3 {
      0%, 30% { opacity: 0; }
      34%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes msgReveal4 {
      0%, 46% { opacity: 0; }
      50%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes msgReveal5 {
      0%, 62% { opacity: 0; }
      66%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes msgReveal6 {
      0%, 78% { opacity: 0; }
      82%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }

    .radar-beam {
      transform-box: view-box;
      transform-origin: 75px 175px;
      animation: radarSpin 4s linear infinite;
    }
    .live-dot {
      animation: statusPulse 1.2s ease-in-out infinite;
    }
    .cursor-blink {
      animation: cursorBlink 0.9s infinite;
    }
    .progress-bar-anim {
      animation: progressSweep 12s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
    }
    .term-msg-1 { animation: msgReveal1 12s ease-out infinite; }
    .term-msg-2 { animation: msgReveal2 12s ease-out infinite; }
    .term-msg-3 { animation: msgReveal3 12s ease-out infinite; }
    .term-msg-4 { animation: msgReveal4 12s ease-out infinite; }
    .term-msg-5 { animation: msgReveal5 12s ease-out infinite; }
    .term-msg-6 { animation: msgReveal6 12s ease-out infinite; }

    .term-font {
      font-family: "JetBrains Mono", Consolas, "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      letter-spacing: 0.02em;
    }
  </style>

  <!-- Terminal Housing Card -->
  <rect width="1000" height="320" rx="12" fill="url(#termBg)" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect width="1000" height="320" rx="12" fill="url(#termGrid)"/>

  <!-- Title Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 988 0 Q 1000 0 1000 12 L 1000 36 L 0 36 Z" fill="url(#titleBarGrad)"/>
  <line x1="0" y1="36" x2="1000" y2="36" stroke="#00f5d4" stroke-opacity="0.2" stroke-width="1"/>

  <!-- macOS / Terminal Window Controls -->
  <circle cx="20" cy="18" r="5.5" fill="#f43f5e"/>
  <circle cx="38" cy="18" r="5.5" fill="#eab308"/>
  <circle cx="56" cy="18" r="5.5" fill="#10b981"/>

  <!-- Title Text -->
  <text x="80" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">
    INDRAMESH TELEMETRY // AUTOMATED ACDI SCANNER &amp; PQC MIGRATION MESH
  </text>

  <!-- Live Status Pill (Right side of Title Bar) -->
  <g transform="translate(815, 8)">
    <rect width="170" height="20" rx="10" fill="#00f5d4" fill-opacity="0.08" stroke="#00f5d4" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="12" cy="10" r="3.5" fill="#10b981" class="live-dot"/>
    <text x="22" y="14" fill="#00f5d4" class="term-font" font-size="9.5" font-weight="700">NTRO SIH26164 ACTIVE</text>
  </g>

  <!-- ═════════════════════════════════════════════════════════════
       LEFT: MICRO RADAR POSTURE DIAL SIMULATOR (Center: 75, 175)
       ═════════════════════════════════════════════════════════════ -->
  <g id="MicroRadar">
    <!-- Outer Dial Rings -->
    <circle cx="75" cy="175" r="52" fill="none" stroke="#00b4d8" stroke-opacity="0.2" stroke-width="1.2"/>
    <circle cx="75" cy="175" r="38" fill="none" stroke="#00f5d4" stroke-opacity="0.3" stroke-dasharray="2 3"/>
    <circle cx="75" cy="175" r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>

    <!-- Crosshair axes -->
    <line x1="75" y1="118" x2="75" y2="232" stroke="#00f5d4" stroke-opacity="0.2" stroke-width="0.8"/>
    <line x1="18" y1="175" x2="132" y2="175" stroke="#00f5d4" stroke-opacity="0.2" stroke-width="0.8"/>

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-beam">
      <animateTransform attributeName="transform" type="rotate" from="0 75 175" to="360 75 175" dur="4s" repeatCount="indefinite"/>
      <path d="M 75 175 L 127 150 A 52 52 0 0 0 75 123 Z" fill="url(#radarSweep)"/>
      <line x1="75" y1="175" x2="127" y2="150" stroke="#00f5d4" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Detected Cryptographic Spoke Nodes (Pulsing) -->
    <circle cx="95" cy="148" r="3" fill="#f43f5e" filter="url(#softCyanGlow)"/>
    <circle cx="104" cy="188" r="2.5" fill="#f59e0b"/>
    <circle cx="56" cy="198" r="2.8" fill="#10b981"/>
    <circle cx="50" cy="145" r="2.2" fill="#38bdf8"/>
    <circle cx="75" cy="175" r="3.5" fill="#00f5d4"/>

    <!-- Radar Label -->
    <text x="75" y="246" text-anchor="middle" fill="#00f5d4" class="term-font" font-size="9" font-weight="700">RADAR HUD</text>
    <text x="75" y="258" text-anchor="middle" fill="#64748b" class="term-font" font-size="8">145 RULES</text>
  </g>

  <!-- Divider Line Between Radar and Terminal Log -->
  <line x1="150" y1="46" x2="150" y2="280" stroke="#1e293b" stroke-width="1.2"/>

  <!-- ═════════════════════════════════════════════════════════════
       RIGHT: LIVE TERMINAL MESSAGE STREAM (GIF-TYPE ANIMATION)
       ═════════════════════════════════════════════════════════════ -->
  <g transform="translate(170, 48)" class="term-font">
    <!-- Command Prompt Line -->
    <g transform="translate(0, 18)">
      <text x="0" y="0" fill="#10b981" font-weight="700">indra@pqc-node</text>
      <text x="96" y="0" fill="#64748b">:</text>
      <text x="106" y="0" fill="#38bdf8">/opt/cii</text>
      <text x="162" y="0" fill="#e2e8f0">$ indramesh scan --estate ./prod --policy india_dst_nqm --cbom</text>
    </g>

    <!-- Streamed Line 1: Discovery -->
    <g transform="translate(0, 48)" class="term-msg-1">
      <rect x="0" y="-12" width="70" height="17" rx="3" fill="#0284c7" fill-opacity="0.2"/>
      <text x="8" y="0" fill="#38bdf8" font-weight="700">DISCOVERY</text>
      <text x="82" y="0" fill="#94a3b8">Scanning 203 source files &amp; manifests across 9 languages...</text>
      <text x="780" y="0" text-anchor="end" fill="#10b981" font-weight="700">[145 RULES OK]</text>
    </g>

    <!-- Streamed Line 2: Cryptographic Artefacts Found -->
    <g transform="translate(0, 78)" class="term-msg-2">
      <rect x="0" y="-12" width="70" height="17" rx="3" fill="#6366f1" fill-opacity="0.2"/>
      <text x="8" y="0" fill="#818cf8" font-weight="700">INVENTORY</text>
      <text x="82" y="0" fill="#94a3b8">Found 128 assets: RSA-4096 (14), ECDH P-384 (8), AES-256 (32)</text>
      <text x="780" y="0" text-anchor="end" fill="#38bdf8" font-weight="700">[ECMA-424]</text>
    </g>

    <!-- Streamed Line 3: Mosca's Inequality Breach -->
    <g transform="translate(0, 108)" class="term-msg-3">
      <rect x="0" y="-12" width="70" height="17" rx="3" fill="#e11d48" fill-opacity="0.25"/>
      <text x="8" y="0" fill="#fb7185" font-weight="700">MOSCA X+Y</text>
      <text x="82" y="0" fill="#e2e8f0">X(25y) + Y(3y) = <tspan fill="#f43f5e" font-weight="700">28y &gt; Z(10y CRQC)</tspan></text>
      <text x="780" y="0" text-anchor="end" fill="#f43f5e" font-weight="700">&#9888; CRITICAL (HNDL)</text>
    </g>

    <!-- Streamed Line 4: FIPS Recommendations -->
    <g transform="translate(0, 138)" class="term-msg-4">
      <rect x="0" y="-12" width="70" height="17" rx="3" fill="#ca8a04" fill-opacity="0.2"/>
      <text x="8" y="0" fill="#facc15" font-weight="700">PQC TARGET</text>
      <text x="82" y="0" fill="#94a3b8">Assigned <tspan fill="#00f5d4" font-weight="700">FIPS 203 (ML-KEM-768)</tspan> &amp; <tspan fill="#38bdf8" font-weight="700">FIPS 204 (ML-DSA-65)</tspan></text>
      <text x="780" y="0" text-anchor="end" fill="#ffd166" font-weight="700">[COST MAPPED]</text>
    </g>

    <!-- Streamed Line 5: CycloneDX 1.7 CBOM Output -->
    <g transform="translate(0, 168)" class="term-msg-5">
      <rect x="0" y="-12" width="70" height="17" rx="3" fill="#059669" fill-opacity="0.2"/>
      <text x="8" y="0" fill="#34d399" font-weight="700">CBOM 1.7</text>
      <text x="82" y="0" fill="#94a3b8">Exported CycloneDX 1.7 CBOM to <tspan fill="#e2e8f0">./indramesh_cbom.json</tspan></text>
      <text x="780" y="0" text-anchor="end" fill="#10b981" font-weight="700">&#10004; SCHEMA VALID</text>
    </g>

    <!-- Streamed Line 6: Verification Guarantee & Blinking Cursor -->
    <g transform="translate(0, 198)" class="term-msg-6">
      <rect x="0" y="-12" width="70" height="17" rx="3" fill="#0d9488" fill-opacity="0.25"/>
      <text x="8" y="0" fill="#2dd4bf" font-weight="700">ASSURANCE</text>
      <text x="82" y="0" fill="#00f5d4" font-weight="700">Air-Gapped Zero-CDN &#183; 1,027 Passing Tests (1000+)</text>
      <!-- Blinking Cursor positioned clearly without colliding -->
      <rect x="520" y="-10" width="8" height="14" fill="#00f5d4" class="cursor-blink"/>
      <text x="780" y="0" text-anchor="end" fill="#00f5d4" font-weight="700">&#10004; 0 REGRESSIONS</text>
    </g>
  </g>

  <!-- ═════════════════════════════════════════════════════════════
       BOTTOM: ACTIVE PROGRESS & PIPELINE METRIC BAR
       ═════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 290)">
    <!-- Base track -->
    <rect width="960" height="14" rx="7" fill="#091428" stroke="#00f5d4" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Animated fill -->
    <rect width="950" height="10" rx="5" x="2" y="2" fill="url(#progressBarGrad)" class="progress-bar-anim" filter="url(#softCyanGlow)"/>
    <text x="480" y="10" text-anchor="middle" fill="#040812" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.1em">
      DISCOVERY &#8226; INVENTORY &#8226; MOSCA RATING &#8226; PQC MAPPING &#8226; CBOM 1.7 EXPORT &#8226; AUDIT COMPLETE
    </text>
  </g>
</svg>
