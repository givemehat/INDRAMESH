[pytest]
# `slow` marks tests that load the real PyTorch model and are excluded from the default
# selection below. Unregistered markers produce a PytestUnknownMarkWarning and, worse, make
# `-m "not slow"` silently select nothing if the marker is not declared.
markers =
    slow: loads the trained model or scans a large corpus; excluded by default
# The property-based suites are slow by nature (hypothesis explores many examples), so they are
# deselected here and run explicitly by CI via `run_tests_by_file.py`. Comment either line out
# to run everything.
addopts = -m "not slow" --strict-markers
pythonpath = .
testpaths = tests

