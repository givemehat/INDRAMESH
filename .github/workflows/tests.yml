name: IndraMesh Testing Suite

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lint:
    # Correctness-only gate (pyflakes + syntax errors), configured in ruff.toml. It is
    # separate from the test job so a style-adjacent failure is legible at a glance, and it
    # needs no dependencies installed -- ruff reads the tree, it does not import it.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ruff
      run: python -m pip install --upgrade ruff

    - name: Lint (F + E9, per ruff.toml)
      run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Install ONLY from requirements.txt. The previous workflow ran
    # `pip install requirements.txt` and then a second, ad-hoc
    # `pip install torch javalang cyclonedx-python-lib` -- which is how the
    # incomplete requirements.txt went unnoticed. Everything the code imports
    # must now be declared in requirements.txt, INCLUDING test-only imports:
    # `hypothesis` was missing for three test modules, so a fresh clone failed at
    # collection. The step below asserts that, so it cannot regress silently.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Verify no undeclared imports
      # Real check, not just a vulnerability audit: collect the test suite and fail if anything
      # is missing. A dependency audit cannot see an unimported-but-required package.
      run: |
        python -m pytest tests --collect-only -q > /dev/null

    - name: Run test suite
      run: |
        export PYTHONPATH=.
        pytest tests/ -v --cov=engine --cov-report=xml --cov-report=term-missing

    - name: Mutation-test the engine
      # A passing suite is not evidence of correctness. This injects deliberate defects and
      # requires the suite to catch them; it fails the build if any survives.
      run: |
        export PYTHONPATH=.
        python mutation_test.py

    - name: Per-file test report with thin-coverage warnings
      run: |
        export PYTHONPATH=.
        python run_tests_by_file.py

    - name: Validate the emitted CBOM against the CycloneDX 1.7 schema
      run: |
        export PYTHONPATH=.
        python cli.py ./dummy_target --format cbom --out ./out --no-ml --fail-on CRITICAL || true
        python validate_cbom.py ./out/indramesh_report.json

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  # The single job above is the gate: mutation testing, coverage, schema validation. It runs on
  # one interpreter only, so a 3.13- or 3.14-only break (a removed stdlib alias, a deprecation
  # that became an error, a wheel that stopped building) would not be seen until someone
  # upgraded locally. README claims four interpreters; a claim nobody exercises is a guess.
  # This job is deliberately thin -- suite only, no mutation harness -- so it stays cheap.
  compatibility:
    name: "py ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run test suite
      run: |
        export PYTHONPATH=.
        pytest tests/ -q --tb=short

    - name: CLI smoke test
      # The documented CI-gate entry point, on every claimed interpreter.
      run: |
        export PYTHONPATH=.
        python cli.py ./dummy_target --format cbom --out ./out-${{ matrix.python-version }} --no-ml --fail-on CRITICAL || [ $? -eq 1 ]
