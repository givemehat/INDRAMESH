name: IndraMesh Quantum Risk Scan

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

# SARIF upload needs write access to the repo's code-scanning results. Without this block
# the upload step is rejected with 403 and the findings never reach the Security tab.
permissions:
  contents: read
  security-events: write

jobs:
  quantum-security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Scan the repository itself. `--fail-on` is a gate: the job fails when a
    # CRITICAL artefact appears, which is the DevSecOps use case the brief asks
    # for. Adjust Z and the policy pack per organisation.
    #
    # The exit code must be inspected rather than discarded. A bare `|| echo ...` was here and
    # it was a false assurance: `||` consumes the status, so a policy trip, a traceback and a
    # bad-argument crash all exited 0, and the most alarming message the tool can emit was
    # printed for a plain crash. Only signal 1 (the gate tripping) is downgraded here; anything
    # >= 2 is a real failure and still fails the job.
    - name: Run IndraMesh scan
      run: |
        export PYTHONPATH=.
        set +e
        python cli.py . --format cbom --z 10 --policy india_dst_nqm --out ./out --fail-on CRITICAL
        rc=$?
        set -e
        if [ "$rc" -eq 0 ]; then
          echo "IndraMesh scan completed with no CRITICAL finding."
        elif [ "$rc" -eq 1 ]; then
          echo "::warning::IndraMesh found CRITICAL quantum risk (see artefacts)"
        else
          echo "::error::IndraMesh scan failed to run (exit $rc) -- this is a tool failure, not a finding"
          exit "$rc"
        fi

    # The same scan, re-emitted as SARIF so every finding becomes a code-scanning alert with
    # an annotation on the offending line. `continue-on-error` is deliberate: an upload
    # refusal (fork PRs get a read-only token) must not reclassify a completed scan as a
    # failed one -- the artefact is still uploaded below either way.
    - name: Emit SARIF for code scanning
      if: always()
      run: |
        export PYTHONPATH=.
        python cli.py . --format sarif --z 10 --policy india_dst_nqm --out ./out --no-ml

    - name: Upload SARIF to the Security tab
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ./out/indramesh.sarif

    - name: Summarise
      if: always()
      run: |
        echo "### IndraMesh CBOM" >> "$GITHUB_STEP_SUMMARY"
        if [ -f ./out/indramesh_report.json ]; then
          echo "CBOM emitted: \`out/indramesh_report.json\`" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f ./out/indramesh_coverage.json ]; then
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        c = json.load(open("./out/indramesh_coverage.json"))
        print(f"Files scanned: {c['files_scanned']}, skipped: {c['files_skipped']}")
        print(f"ML engine: {c['ml_reason']}")
        print("Never in scope:")
        for g in c["never_in_scope"]:
            print(f"- {g}")
        PY
        fi

    - name: Upload artefacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: indramesh-report
        path: out/
